<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>室內地圖描圖工具</title>
<style>
  :root {
    --ink: #172033; --ink-2: #44506a; --muted: #7a859c; --rule: #d8dfeb; --paper: #f6f8fb;
    --accent: #e0654a; --teal: #1fb5a5; --room: rgba(31, 181, 165, 0.16); --room-line: #139688; --wall: #26334f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); display: grid; font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; grid-template-rows: auto auto minmax(0, 1fr) auto; }
  header { align-items: center; background: #fff; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 8px 14px; }
  header h1 { font-size: 16px; margin: 0 6px 0 0; }
  .group { align-items: center; background: #eef2f9; border-radius: 10px; display: inline-flex; padding: 3px; }
  button, select, input { font: inherit; }
  .group button, .btn { background: transparent; border: 0; border-radius: 8px; color: var(--ink-2); cursor: pointer; font-size: 13px; padding: 6px 11px; }
  .group button[aria-pressed="true"] { background: #fff; box-shadow: 0 1px 3px rgba(20, 30, 60, 0.2); color: var(--ink); font-weight: 700; }
  .group button kbd { background: rgba(0, 0, 0, 0.07); border-radius: 4px; font-size: 10px; margin-left: 4px; padding: 0 4px; }
  .btn { background: #eef2f9; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn:disabled { cursor: not-allowed; opacity: 0.4; }
  .spacer { flex: 1; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
  .stage { background: #fff; cursor: crosshair; min-height: 0; overflow: hidden; position: relative; touch-action: none; }
  .stage.select { cursor: default; }
  .stage.panning { cursor: grabbing; }
  .stage svg { height: 100%; left: 0; position: absolute; top: 0; width: 100%; }
  .stage .overlay { pointer-events: none; }
  .minor { fill: none; stroke: #c3cadb; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
  .major { fill: none; stroke: #6b7694; stroke-width: 0.9; vector-effect: non-scaling-stroke; }
  .stage.faint .minor, .stage.faint .major { opacity: 0.45; }
  .room { fill: var(--room); stroke: var(--room-line); stroke-linejoin: round; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .room.auto { stroke-width: 0.8; }
  .room.public { fill: rgba(120, 140, 200, 0.14); stroke: #5f74bd; }
  .room.void { fill: rgba(255, 255, 255, 0.35); stroke: #8a95b3; stroke-dasharray: 6 4; }
  .room.selected { fill: rgba(224, 101, 74, 0.22); stroke: var(--accent); stroke-width: 2.2; }
  .room:hover { fill: rgba(255, 190, 90, 0.28); }
  .wall { fill: none; stroke: var(--wall); stroke-linecap: round; stroke-linejoin: round; stroke-width: 3.2; vector-effect: non-scaling-stroke; }
  .wall.selected { stroke: var(--accent); stroke-width: 4; }
  .draft { fill: rgba(224, 101, 74, 0.12); stroke: var(--accent); stroke-dasharray: 5 4; stroke-width: 1.6; }
  .draft.wall { fill: none; stroke-width: 3; }
  .handle { fill: #fff; stroke: var(--accent); stroke-width: 2; }
  .handle.active { fill: var(--accent); }
  .snap { fill: none; stroke-width: 2; }
  .label { fill: var(--ink); font-size: 12px; paint-order: stroke; stroke: rgba(255, 255, 255, 0.9); stroke-linejoin: round; stroke-width: 3px; text-anchor: middle; }
  .src { fill: #8a6d00; font-size: 10px; paint-order: stroke; stroke: rgba(255, 255, 255, 0.85); stroke-width: 2.5px; text-anchor: middle; }
  .hint { background: rgba(23, 32, 51, 0.88); border-radius: 8px; bottom: 10px; color: #fff; font-size: 12px; left: 12px; max-width: calc(100% - 24px); padding: 6px 10px; position: absolute; }
  aside { background: #fff; border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-size: 13px; margin: 0; padding: 10px 14px 4px; }
  .list { flex: 1; list-style: none; margin: 0; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .list button { background: transparent; border: 0; border-radius: 8px; color: inherit; cursor: pointer; display: block; font-size: 13px; padding: 5px 10px; text-align: left; width: 100%; }
  .list button:hover { background: #eef2f9; }
  .list button[aria-current="true"] { background: #fde7df; }
  .list small { color: var(--muted); display: block; font-size: 11px; }
  .props { border-top: 1px solid var(--rule); font-size: 13px; max-height: 48%; overflow-y: auto; padding: 10px 14px; }
  .props label { color: var(--muted); display: block; font-size: 12px; margin-top: 8px; }
  .props input[type="text"], .props select { border: 1px solid var(--rule); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .results { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .results button { background: #f4f7fc; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; font-size: 12px; padding: 4px 8px; text-align: left; }
  .results button:hover { background: #fde7df; }
  .results small { color: var(--muted); }
  .two { display: grid; gap: 8px; grid-template-columns: 1fr 1.4fr; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .note { background: #eef6ff; border-radius: 8px; color: #2a4a7a; font-size: 12px; margin-top: 8px; padding: 6px 8px; }
  .btn:hover:not(:disabled), .group button:hover { background: #e2e8f3; }
  .btn.primary:hover:not(:disabled) { background: #2a3856; }
  .group button[aria-pressed="true"]:hover { background: #fff; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  .btn kbd { background: rgba(0, 0, 0, 0.07); border-radius: 4px; font-size: 10px; margin-left: 4px; padding: 0 4px; }
  .subbar { align-items: center; background: #fbfcfe; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; gap: 6px 10px; padding: 5px 14px; }
  .subbar .label-s { color: var(--muted); font-size: 12px; }
  .sep { background: var(--rule); height: 18px; width: 1px; }
  .zoom { background: #fff; border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 2px 8px rgba(20, 30, 60, 0.1); display: flex; flex-direction: column; overflow: hidden; position: absolute; right: 12px; top: 12px; }
  .zoom button { background: #fff; border: 0; color: var(--ink-2); cursor: pointer; font-size: 16px; height: 34px; width: 36px; }
  .zoom button + button { border-top: 1px solid var(--rule); }
  .zoom button:hover { background: #eef2f9; }
  .coords { background: rgba(255, 255, 255, 0.9); border-radius: 6px; bottom: 10px; color: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; padding: 3px 8px; pointer-events: none; position: absolute; right: 12px; }
  .stage .hint { pointer-events: none; }
  .stage.aligning { cursor: crosshair; }
  .helpcard { background: #fff; border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 6px 24px rgba(20, 30, 60, 0.18); font-size: 12.5px; max-width: 380px; padding: 12px 16px; position: absolute; right: 60px; top: 12px; z-index: 5; }
  .helpcard h3 { font-size: 13px; margin: 0 0 6px; }
  .helpcard dl { display: grid; gap: 4px 10px; grid-template-columns: auto 1fr; margin: 0; }
  .helpcard dt { color: var(--muted); }
  .helpcard dd { margin: 0; }
  .listtools { align-items: center; display: flex; gap: 8px; padding: 2px 12px 6px; }
  .listtools input[type="search"] { border: 1px solid var(--rule); border-radius: 8px; flex: 1; min-width: 0; padding: 5px 8px; }
  .listtools label { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
  .list .empty { color: var(--muted); font-size: 12px; padding: 12px; }
  .marquee { fill: rgba(31, 181, 165, 0.1); stroke: var(--teal); stroke-dasharray: 4 3; stroke-width: 1.2; }
  .pickdot { fill: #fff; stroke: var(--accent); stroke-width: 1.5; }
  .pickdot.hover { fill: var(--accent); }
  .ghost { fill: rgba(31, 181, 165, 0.12); stroke: var(--teal); stroke-dasharray: 5 3; stroke-width: 1.6; }
  .ghost.wall { fill: none; stroke-width: 3; }
  .move { border-top: 1px dashed var(--rule); margin-top: 12px; padding-top: 4px; }
  .move .title { color: var(--ink); font-size: 12px; font-weight: 700; margin-top: 6px; }
  .shift-pad { display: grid; gap: 4px; grid-template-areas: ". up ." "left . right" ". down ."; justify-content: center; margin: 8px 0; }
  .shift-pad button { background: #eef2f9; border: 0; border-radius: 8px; cursor: pointer; font-size: 16px; height: 32px; width: 44px; }
  .shift-pad button:hover { background: #dfe6f2; }
  .shift-pad button[aria-label="往上"] { grid-area: up; }
  .shift-pad button[aria-label="往左"] { grid-area: left; }
  .shift-pad button[aria-label="往右"] { grid-area: right; }
  .shift-pad button[aria-label="往下"] { grid-area: down; }
  .fields { align-items: center; display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; }
  .fields label { align-items: center; color: var(--ink-2); display: inline-flex; font-size: 12px; gap: 4px; margin: 0; }
  .fields input[type="number"] { border: 1px solid var(--rule); border-radius: 8px; padding: 4px 6px; width: 78px; }
  .props .btn { background: #eef2f9; }
  .props .btn.accent { background: var(--teal); color: #fff; }
  footer { background: #fff; border-top: 1px solid var(--rule); color: var(--ink-2); display: flex; flex-wrap: wrap; font-size: 12px; gap: 4px 18px; padding: 6px 14px; }
  footer b { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="group" role="group" aria-label="工具" id="tools">
    <button type="button" data-tool="select" aria-pressed="true" title="選取、拖曳頂點、雙擊邊線加點">選取<kbd>V</kbd></button>
    <button type="button" data-tool="wall" aria-pressed="false" title="畫牆：逐點點出，線段會被當成牆">牆<kbd>W</kbd></button>
    <button type="button" data-tool="arcwall" aria-pressed="false" title="畫弧形的牆：起點、終點、再點弧上一點">弧牆<kbd>A</kbd></button>
    <button type="button" data-tool="rect" aria-pressed="false" title="直接描一個矩形房間">矩形<kbd>R</kbd></button>
    <button type="button" data-tool="poly" aria-pressed="false" title="逐點描出任意形狀的房間">多邊形<kbd>P</kbd></button>
    <button type="button" data-tool="semi" aria-pressed="false" title="點直徑兩端，再點一側">半圓<kbd>C</kbd></button>
    <button type="button" data-tool="circle" aria-pressed="false" title="點圓心，再點半徑">圓<kbd>O</kbd></button>
    <button type="button" data-tool="wand" aria-pressed="false" title="魔術棒：點一下房間內部，自動找出封閉範圍；按住拖曳塗抹可合併多處">魔術棒<kbd>M</kbd></button>
  </div>
  <div class="group">
    <button type="button" id="undo" title="復原 Ctrl+Z">↶ 復原</button>
    <button type="button" id="redo" title="重做 Ctrl+Y">↷ 重做</button>
  </div>
  <span class="spacer"></span>
  <button type="button" class="btn" id="help" aria-expanded="false" title="顯示操作說明">操作說明</button>
  <button type="button" class="btn" id="import">匯入</button>
  <button type="button" class="btn primary" id="export">匯出 JSON</button>
  <input type="file" id="file" accept="application/json,.json" hidden />
</header>
<div class="subbar">
  <span class="label-s">顯示</span>
  <div class="group" role="group" aria-label="顯示與行為">
    <button type="button" id="toggle-live" aria-pressed="true" title="牆圍成封閉區域時，自動產生房間">即時生成房間</button>
    <button type="button" id="toggle-minor" aria-pressed="false" title="顯示短線（門、傢俱等）">短線</button>
    <button type="button" id="toggle-texts" aria-pressed="true" title="顯示原圖文字">原圖文字</button>
    <button type="button" id="toggle-faint" aria-pressed="false" title="把底圖調淡">淡化底圖</button>
    <button type="button" id="toggle-snap" aria-pressed="true" title="吸附到牆線端點與其他物件">吸附</button>
  </div>
  <span class="sep"></span>
  <span id="wand-opts" hidden>
    <label class="label-s" title="底圖牆線有門口或小缺口時，魔術棒仍視為封閉的最大缺口寬度">缺口容忍
      <select id="wand-gap"><option value="0">0 公分</option><option value="50">50 公分</option><option value="100" selected>100 公分</option><option value="150">150 公分</option><option value="250">250 公分</option></select>
    </label>
    <span class="sep"></span>
  </span>
  <button type="button" class="btn" id="select-all" title="選取所有牆與房間，之後可整組移動、對齊到底圖">全選<kbd>Ctrl+A</kbd></button>
  <button type="button" class="btn" id="generate" title="依目前的牆重新產生房間">由牆生成房間</button>
  <button type="button" class="btn" id="tidy" title="頂點靠攏、邊線拉直、相鄰物件共邊">自動整理</button>
</div>

<main>
  <div class="stage select" id="stage">
    <svg id="plan" aria-label="平面圖底圖、牆與房間"></svg>
    <svg id="overlay" class="overlay" aria-hidden="true"></svg>
    <div class="hint" id="hint"></div>
    <div class="coords" id="coords"></div>
    <div class="zoom" role="group" aria-label="縮放">
      <button type="button" id="zoom-in" aria-label="放大" title="放大">＋</button>
      <button type="button" id="zoom-out" aria-label="縮小" title="縮小">－</button>
      <button type="button" id="zoom-fit" aria-label="縮放至全部" title="縮放至全部（F）">⤢</button>
    </div>
    <div class="helpcard" id="helpcard" hidden>
      <h3>操作說明</h3>
      <dl>
        <dt>平移縮放</dt><dd>滾輪縮放；按住右鍵、中鍵或空白鍵拖曳平移；F 縮放至全部</dd>
        <dt>框選</dt><dd>選取工具在空白處拖曳；Shift 加選或減選；Ctrl+A 全選；Esc 取消選取</dd>
        <dt>移動</dt><dd>拖曳選取的物件；方向鍵微調（Shift 加大十倍）；步距可在右側自行輸入</dd>
        <dt>對齊底圖</dt><dd>右側「對齊到底圖」：先點選取範圍上的一個頂點，再點底圖的端點或邊線</dd>
        <dt>編輯</dt><dd>拖曳白點移動頂點；雙擊邊線加點；Delete 刪除；Ctrl+Z、Ctrl+Y 復原重做</dd>
        <dt>工具</dt><dd>V 選取、W 牆、A 弧牆、R 矩形、P 多邊形、C 半圓、O 圓、M 魔術棒</dd>
      </dl>
    </div>
  </div>
  <aside>
    <h2>房間 <span id="count"></span></h2>
    <div class="listtools">
      <input type="search" id="list-q" placeholder="搜尋代碼或名稱…" aria-label="搜尋房間" />
      <label><input type="checkbox" id="list-unset" /> 只看未設定</label>
    </div>
    <ul class="list" id="list"></ul>
    <section class="props" id="props" aria-live="polite"></section>
  </aside>
</main>
<footer id="stats"></footer>

<script>
const DATA = /*__TRACE_DATA__*/null;

const STORE_KEY = "indoor-trace:" + DATA.title + ":" + DATA.source;
const LOCATIONS = DATA.locations || [];
const locationByCode = new Map(LOCATIONS.map((l) => [l.code, l]));
const TYPE_NAMES = { room: "房間", public: "公共區域", void: "挑空／採光" };
const HINTS = {
  select: "點房間或牆選取；拖曳白點移動頂點；雙擊邊線加點；Delete 刪除；空白處拖曳或按住空白鍵可平移",
  wall: "逐點點出牆；Enter、雙擊或點回起點完成；Backspace 退一點；Shift 鎖定水平／垂直。牆圍成封閉區域就會自動變成房間",
  arcwall: "弧形的牆：先點起點，再點終點，最後點弧線上的一點決定彎曲方向與弧度",
  rect: "直接描矩形房間：按住拖曳，或依序點兩個對角；Esc 取消",
  poly: "逐點描房間外形；Enter、雙擊或點回第一點完成；Backspace 退一點；Shift 鎖定水平／垂直",
  semi: "半圓房間：先點直徑的兩個端點，再把滑鼠移到要凸出的一側後點一下",
  circle: "圓形房間：先點圓心，再點圓周上的任一點",
  wand: "魔術棒：游標移到房間內部會預覽範圍，點一下建立房間；按住拖曳塗抹可把多處合併成一間；範圍圍不起來時，調高「缺口容忍」或先用牆補上缺口",
};
const SVGNS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const make = (name, attrs = {}, parent) => {
  const node = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.append(node);
  return node;
};

// ---- state ---------------------------------------------------------------------
let rooms = [];                   // { id, name, type, ring, auto?, anchor?, curve? }
let walls = [];                   // { id, pts, curve? }
let suppressed = [];              // anchors of generated rooms the user deleted
let selectedId = null;            // a room id
let selectedWallId = null;
let selectedVertex = null;
let group = null;                 // { rooms: [ids], walls: [ids] } while several things are selected
let align = null;                 // { stage: "pick" | "target", from, cap, cursor, hover }
let marquee = null;               // { a, b } in screen pixels
let wand = null;                  // a brush stroke in progress: { r, mask, any, last, path }
let wandPreview = null;           // ring (page coordinates) the wand would create
let wandGap = 100, wandCache = null, wandTimer = null;
let stateRev = 0;                 // bumps whenever walls or rooms change, so cached rasters can be dropped
let stepCm = 50;                  // how far one nudge moves, typed by the user
let listQuery = "", listUnset = false;
let tool = "select";
let draft = null;
let drag = null;
let view = { z: 1, tx: 0, ty: 0 };
let size = { w: 1000, h: 700 };
let snapOn = true;
let showTexts = true;
let liveRooms = true;
let spaceDown = false;
let snapHit = null;
let history = [], future = [];
let counter = 1;
let generateTimer = null;

const stage = $("stage");
const planSvg = $("plan");
const overlay = $("overlay");
let viewGroup, minorPath, majorPath, roomGroup, wallGroup;

// ---- geometry helpers ------------------------------------------------------------
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const round1 = (v) => Math.round(v * 10) / 10;
function signedArea(ring) {
  let sum = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
    sum += x1 * y2 - x2 * y1;
  }
  return sum / 2;
}
const area = (ring) => Math.abs(signedArea(ring));
function centroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length; i++) {
    const [x1, y1] = ring[i], [x2, y2] = ring[(i + 1) % ring.length];
    const cross = x1 * y2 - x2 * y1;
    a += cross; cx += (x1 + x2) * cross; cy += (y1 + y2) * cross;
  }
  if (Math.abs(a) < 1e-6) return ring[0];
  return [cx / (3 * a), cy / (3 * a)];
}
function inRing(ring, [x, y]) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function closestOnSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len2 = dx * dx + dy * dy;
  const t = len2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2)) : 0;
  return { point: [a[0] + t * dx, a[1] + t * dy], t };
}
/** A point that is really inside the ring (the centroid can fall outside an L shape). */
function interiorPoint(ring, holes = []) {
  const c = centroid(ring);
  if (inRing(ring, c) && !holes.some((h) => inRing(h, c))) return [round1(c[0]), round1(c[1])];
  const y = c[1];
  const xs = [];
  for (const loop of [ring, ...holes]) for (let i = 0; i < loop.length; i++) {
    const [x1, y1] = loop[i], [x2, y2] = loop[(i + 1) % loop.length];
    if ((y1 > y) !== (y2 > y)) xs.push(x1 + ((y - y1) / (y2 - y1)) * (x2 - x1));
  }

function tidyWalls() {

  clusters.forEach((c) => {

    let best = null;
    for (const key of cellsAround(c.p, TOL)) for (const i of ptGrid.get(key) || []) {
      const d = dist(c.p, DATA.points[i]);
      if (d <= TOL && (!best || d < best.d)) best = { d, p: DATA.points[i] };
    }
    if (best) { c.p = [best.p[0], best.p[1]]; c.fixed = true; pulled += 1; }

    ids.forEach((wallIds, wi) => {
      if (wallIds.includes(ci)) return;
      for (let i = 0; i + 1 < wallIds.length; i++) {
        const hit = closestOnSegment(c.p, clusters[wallIds[i]].p, clusters[wallIds[i + 1]].p);

      if (a === b || (a.fixed && b.fixed)) continue;
      const dx = b.p[0] - a.p[0], dy = b.p[1] - a.p[1];

  const inside = (pts) => pts.every(([x, y]) => x >= x0 && x <= x1 && y >= y0 && y <= y1);
  const keep = m.additive ? selectedItems() : { rooms: [], walls: [] };
  const pickedRooms = new Set(keep.rooms), pickedWalls = new Set(keep.walls);
  rooms.forEach((r) => { if (inside(r.ring)) pickedRooms.add(r.id); });
  walls.forEach((w) => { if (inside(w.pts)) pickedWalls.add(w.id); });
  setSelection([...pickedRooms], [...pickedWalls]);
  refresh();
}
function zoomBy(factor) {
  const z = Math.min(40, Math.max(0.02, view.z * factor));
  const k = z / view.z, px = size.w / 2, py = size.h / 2;
  view.tx = px - k * (px - view.tx); view.ty = py - k * (py - view.ty); view.z = z;
  applyView();
}

// ---- pointer handling -------------------------------------------------------------------------------------------
function screenPoint(clientX, clientY) {
  const box = stage.getBoundingClientRect();
  return [clientX - box.left, clientY - box.top];
}
function vertexAt(points, clientX, clientY) {
  const [sx, sy] = screenPoint(clientX, clientY);
  let best = null;
  points.forEach((v, i) => {
    const [vx, vy] = toScreen(v);
    const d = Math.hypot(vx - sx, vy - sy);
    if (d <= 9 && (!best || d < best.d)) best = { d, i };
  });
  return best ? best.i : null;
}
function edgeAt(points, closed, clientX, clientY) {
  const p = screenPoint(clientX, clientY);
  let best = null;
  const count = closed ? points.length : points.length - 1;
  for (let i = 0; i < count; i++) {
    const a = toScreen(points[i]), b = toScreen(points[(i + 1) % points.length]);
    const hit = closestOnSegment(p, a, b);
    const d = dist(p, hit.point);
    if (d <= 8 && (!best || d < best.d)) best = { d, i, t: hit.t };
  }
  return best;
}
function wallAt(clientX, clientY) {
  let best = null;
  for (const wall of walls) {
    const edge = edgeAt(wall.pts, false, clientX, clientY);
    if (edge && (!best || edge.d < best.d)) best = { wall, d: edge.d };
  }
  return best?.wall || null;
}
const mostlyClick = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]) < 6;

stage.addEventListener("contextmenu", (e) => e.preventDefault());
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest?.(".zoom, .helpcard")) return;
  stage.setPointerCapture?.(e.pointerId);
  if (e.button === 1 || e.button === 2 || spaceDown) { drag = { type: "pan", x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty }; stage.classList.add("panning"); return; }
  if (e.button !== 0) return;
  const raw = toPlan(e.clientX, e.clientY);
  if (align) { alignClick(e); return; }
  if (tool === "select") {
    const clickedWall = wallAt(e.clientX, e.clientY);
    const clickedEl = e.target.closest?.("[data-id]");
    if (e.shiftKey && (clickedWall || clickedEl)) {
      // Shift adds a room or wall to the selection, or takes it out again.
      const items = selectedItems();
      const roomIds = new Set(items.rooms), wallIds = new Set(items.walls);
      const [set, id] = clickedWall ? [wallIds, clickedWall.id] : [roomIds, clickedEl.dataset.id];
      if (set.has(id)) set.delete(id); else set.add(id);
      setSelection([...roomIds], [...wallIds]);
      refresh();
      return;
    }
    if (group) {
      if ((clickedWall && group.walls.includes(clickedWall.id)) || (!clickedWall && clickedEl && group.rooms.includes(clickedEl.dataset.id))) {
        drag = { type: "group", start: raw, cap: captureSelection(), moved: false, recorded: false };
        return;
      }
      group = null;   // clicking something else drops the group; what was clicked is selected below
    }
    const wall = wallById(selectedWallId), room = roomById(selectedId);
    const handles = wall?.pts || room?.ring;
    if (handles) {
      const index = vertexAt(handles, e.clientX, e.clientY);
      if (index !== null) {
        pushHistory(); selectedVertex = index;
        if (wall) {
          // Other walls that end on this same corner follow it, so a joint stays closed.
          const here = wall.pts[index];
          const joined = [];
          walls.forEach((other) => other.pts.forEach((p, j) => { if (!(other.id === wall.id && j === index) && dist(p, here) <= 1) joined.push([other.id, j]); }));
          drag = { type: "wallVertex", id: wall.id, index, joined };
        } else drag = { type: "vertex", id: room.id, index };
        renderOverlay();
        return;
      }
    }
    const hitWall = wallAt(e.clientX, e.clientY);
    if (hitWall) { selectedWallId = hitWall.id; selectedId = null; selectedVertex = null; renderScene(); renderOverlay(); renderPanel(); return; }
    const hit = e.target.closest?.("[data-id]");
    if (hit) {
      selectedId = hit.dataset.id; selectedWallId = null; selectedVertex = null;
      const picked = roomById(selectedId);
      drag = { type: "room", id: selectedId, start: raw, original: picked.ring.map((p) => [...p]), originalHoles: (picked.holes || []).map((h) => h.map((p) => [...p])), moved: false, recorded: false };
    } else {
      // Empty space starts a box selection (Shift keeps what is already selected); right button or Space pans.
      if (!e.shiftKey) setSelection([], []);
      const a = screenPoint(e.clientX, e.clientY);
      marquee = { a, b: a, additive: e.shiftKey };
      drag = { type: "marquee" };
    }
    renderScene(); renderOverlay(); renderPanel();
    return;
  }
  if (tool === "wand") { wandDown(e, raw); return; }
  const { p } = snap(raw, { from: draft?.pts?.at(-1), axis: e.shiftKey });
  const press = [e.clientX, e.clientY];
  if (tool === "rect") {
    if (draft && draft.pts.length === 1) { const ring = rectRing(draft.pts[0], p); draft = null; if (Math.abs(ring[0][0] - ring[2][0]) > 5 && Math.abs(ring[0][1] - ring[2][1]) > 5) addRoom(ring); }
    else { draft = { tool, pts: [p], cursor: p, press }; drag = { type: "rect" }; }
  } else if (tool === "poly" || tool === "wall") {
    const closing = draft && draft.pts.length >= (tool === "poly" ? 3 : 2) && dist(p, draft.pts[0]) <= 12 / view.z;
    if (closing) {
      if (tool === "wall") draft.pts.push([...draft.pts[0]]);
      finishPath();
      return;
    }
    if (!draft) draft = { tool, pts: [], cursor: p };
    draft.pts.push(p);
  } else if (tool === "arcwall") {
    if (!draft) draft = { tool, pts: [p], cursor: p };
    else if (draft.pts.length === 1) draft.pts.push(p);
    else {
      const [start, end] = draft.pts;
      const points = arcPoints(start, end, p);
      draft = null;
      addWall(points, true);
    }
  } else if (tool === "semi") {
    if (!draft) draft = { tool, pts: [p], cursor: p };
    else if (draft.pts.length === 1) draft.pts.push(p);
    else {
      const [a, b] = draft.pts;
      const ring = semicircleRing(a, b, p);
      draft = null;
      if (ring.length) addRoom(ring, { type: "semicircle", a: [round1(a[0]), round1(-a[1])], b: [round1(b[0]), round1(-b[1])] });
    }
  } else if (tool === "circle") {
    if (!draft) draft = { tool, pts: [p], cursor: p };
    else {
      const center = draft.pts[0];
      const ring = circleRing(center, p);
      draft = null;
      if (dist(center, p) > 3) addRoom(ring, { type: "circle", center: [round1(center[0]), round1(-center[1])], radius: round1(dist(center, p)) });
    }
  }
  renderOverlay();
});
stage.addEventListener("pointermove", (e) => {
  const raw = toPlan(e.clientX, e.clientY);
  $("coords").textContent = `x ${(raw[0] / 100).toFixed(2)} m　y ${(-raw[1] / 100).toFixed(2)} m`;
  if (drag?.type === "pan") {
    view.tx = drag.tx + e.clientX - drag.x; view.ty = drag.ty + e.clientY - drag.y;
    applyView();
    return;
  }
  if (drag?.type === "marquee") { marquee.b = screenPoint(e.clientX, e.clientY); renderOverlay(); return; }
  if (drag?.type === "group") {
    const dx = raw[0] - drag.start[0], dy = raw[1] - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) * view.z < 4) return;
    if (!drag.recorded) { pushHistory(); drag.recorded = true; }
    drag.moved = true;
    placeSelection(drag.cap, dx, dy);
    renderScene(); renderOverlay();
    return;
  }
  if (align) {
    if (align.stage === "pick") align.hover = nearestVertex(selectionVertices(), e.clientX, e.clientY);
    else {
      const items = selectedItems();
      const hit = snap(raw, { skip: { rooms: new Set(items.rooms), walls: new Set(items.walls) } });
      align.cursor = hit.p; snapHit = hit;
    }
    renderOverlay();
    return;
  }
  if (drag?.type === "vertex") {
    const room = roomById(drag.id);
    const hit = snap(raw, { excludeRoom: drag.id, excludeIndex: drag.index });
    room.ring[drag.index] = [round1(hit.p[0]), round1(hit.p[1])];
    delete room.curve; room.auto = false;
    snapHit = hit;
    renderScene(); renderOverlay();
    return;
  }
  if (drag?.type === "wallVertex") {
    const wall = wallById(drag.id);
    const hit = snap(raw, { excludeWall: drag.id, excludeIndex: drag.index });
    wall.pts[drag.index] = [round1(hit.p[0]), round1(hit.p[1])];
    delete wall.curve;
    for (const [otherId, j] of drag.joined || []) {
      const other = wallById(otherId);
      if (other) { other.pts[j] = [round1(hit.p[0]), round1(hit.p[1])]; delete other.curve; }
    }
    snapHit = hit;
    renderScene(); renderOverlay();
    if (liveRooms) scheduleGenerate();
    return;
  }
  if (drag?.type === "room") {
    const dx = raw[0] - drag.start[0], dy = raw[1] - drag.start[1];
    if (!drag.moved && Math.hypot(dx, dy) * view.z < 4) return;
    if (!drag.recorded) { pushHistory(); drag.recorded = true; }
    drag.moved = true;
    const room = roomById(drag.id);
    room.ring = drag.original.map((p) => [round1(p[0] + dx), round1(p[1] + dy)]);
    if (drag.originalHoles?.length) room.holes = drag.originalHoles.map((h) => h.map((p) => [round1(p[0] + dx), round1(p[1] + dy)]));
    delete room.curve; room.auto = false;
    renderScene(); renderOverlay();
    return;
  }
  if (tool === "wand") { wandMove(e, raw); return; }
  const hit = tool === "select" ? { p: raw, kind: null } : snap(raw, { from: draft?.pts?.at(-1), axis: e.shiftKey });
  snapHit = hit;
  if (draft) draft.cursor = hit.p;
  renderOverlay();
});
stage.addEventListener("pointerup", (e) => {
  const finished = drag;
  drag = null;
  stage.classList.remove("panning");
  if (finished?.type === "wand") { wandUp(); return; }
  if (finished?.type === "marquee") { const m = marquee; marquee = null; finishMarquee(m); return; }
  if (finished?.type === "group") { if (finished.moved) changed(true, needsRegenerate(finished.cap)); return; }
  if (finished?.type === "vertex") { changed(true, false); return; }
  if (finished?.type === "wallVertex") { changed(); return; }
  if (finished?.type === "room") { if (finished.moved) changed(true, false); return; }
  if (finished?.type === "rect" && draft && !mostlyClick([e.clientX, e.clientY], draft.press)) {
    const p = snap(toPlan(e.clientX, e.clientY)).p;
    const ring = rectRing(draft.pts[0], p);
    draft = null;
    if (Math.abs(ring[0][0] - ring[2][0]) > 5 && Math.abs(ring[0][1] - ring[2][1]) > 5) addRoom(ring);
    renderOverlay();
  }
});
stage.addEventListener("dblclick", (e) => {
  if (tool === "poly" || tool === "wall") { if (draft) { draft.pts.pop(); finishPath(); } return; }
  if (tool !== "select") return;
  const wall = wallById(selectedWallId), room = roomById(selectedId);
  const points = wall?.pts || room?.ring;
  if (!points) return;
  const edge = edgeAt(points, !wall, e.clientX, e.clientY);
  if (!edge) return;
  pushHistory();
  const a = points[edge.i], b = points[(edge.i + 1) % points.length];
  points.splice(edge.i + 1, 0, [round1(a[0] + (b[0] - a[0]) * edge.t), round1(a[1] + (b[1] - a[1]) * edge.t)]);
  if (wall) delete wall.curve; else { delete room.curve; room.auto = false; }
  selectedVertex = edge.i + 1;
  changed(true, !!wall);
});
stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  const box = stage.getBoundingClientRect();
  const px = e.clientX - box.left, py = e.clientY - box.top;
  const z = Math.min(40, Math.max(0.02, view.z * Math.exp(-e.deltaY * 0.0016)));
  const k = z / view.z;
  view.tx = px - k * (px - view.tx); view.ty = py - k * (py - view.ty); view.z = z;
  applyView();
}, { passive: false });

// ---- toolbar and keys -------------------------------------------------------------------------------------------------
$("tools").addEventListener("click", (e) => { const b = e.target.closest("button[data-tool]"); if (b) setTool(b.dataset.tool); });
$("undo").addEventListener("click", undo);
$("redo").addEventListener("click", redo);
$("tidy").addEventListener("click", tidy);
$("select-all").addEventListener("click", selectAll);
$("wand-gap").addEventListener("change", (e) => { wandGap = Number(e.target.value); wandCache = null; wandPreview = null; renderOverlay(); });
$("zoom-in").addEventListener("click", () => zoomBy(1.4));
$("zoom-out").addEventListener("click", () => zoomBy(1 / 1.4));
$("zoom-fit").addEventListener("click", () => { fit(); applyView(); });
$("help").addEventListener("click", () => {
  const card = $("helpcard");
  card.hidden = !card.hidden;
  $("help").setAttribute("aria-expanded", String(!card.hidden));
});
$("list-q").addEventListener("input", (e) => { listQuery = e.target.value.trim().toLowerCase(); renderPanel(); });
$("list-unset").addEventListener("change", (e) => { listUnset = e.target.checked; renderPanel(); });
function visibleRooms() {
  return rooms.filter((r) => (!listUnset || !r.locationCode) && (!listQuery || `${r.locationCode} ${r.name}`.toLowerCase().includes(listQuery)));
}
$("generate").addEventListener("click", () => { clearTimeout(generateTimer); generateRooms(); });
$("export").addEventListener("click", exportJson);
$("import").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try { importJson(await file.text()); } catch (error) { alert("無法匯入：" + error.message); }
});
const flip = (id, on) => $(id).setAttribute("aria-pressed", String(on));
$("toggle-live").addEventListener("click", () => { liveRooms = !liveRooms; flip("toggle-live", liveRooms); if (liveRooms) scheduleGenerate(); });
$("toggle-minor").addEventListener("click", (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  flip("toggle-minor", on);
  minorPath.style.display = on ? "" : "none";
});
$("toggle-texts").addEventListener("click", () => { showTexts = !showTexts; flip("toggle-texts", showTexts); renderOverlay(); });
$("toggle-faint").addEventListener("click", (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  flip("toggle-faint", on);
  stage.classList.toggle("faint", on);
});
$("toggle-snap").addEventListener("click", () => { snapOn = !snapOn; flip("toggle-snap", snapOn); snapHit = null; renderOverlay(); });
$("list").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]");
  if (!b) return;
  group = null; selectedId = b.dataset.id; selectedWallId = null; selectedVertex = null;
  const room = roomById(selectedId);
  if (room) {
    const [cx, cy] = room.anchor || centroid(room.ring);
    view.tx = size.w / 2 - view.z * cx; view.ty = size.h / 2 - view.z * cy;
    applyView();
  }
  renderScene(); renderOverlay(); renderPanel();
});
window.addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) return;
  const key = e.key.toLowerCase();
  if (e.ctrlKey || e.metaKey) {
    if (key === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (key === "y" || (key === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
    else if (key === "a") { e.preventDefault(); selectAll(); }
    return;
  }
  if (e.code === "Space") { spaceDown = true; e.preventDefault(); return; }
  if (key.startsWith("arrow") && hasSelection() && !align) {
    e.preventDefault();
    const step = stepCm * (e.shiftKey ? 10 : 1);
    moveSelection(key === "arrowleft" ? -step : key === "arrowright" ? step : 0, key === "arrowup" ? -step : key === "arrowdown" ? step : 0);
    return;
  }
  if (key === "f") { fit(); applyView(); return; }
  if (key === "?" ) { $("help").click(); return; }
  const tools = { v: "select", w: "wall", a: "arcwall", r: "rect", p: "poly", c: "semi", o: "circle", m: "wand" };
  if (tools[key]) setTool(tools[key]);
  else if (key === "escape") {
    if (align) { cancelAlign(); return; }
    if (draft) draft = null;
    else if (hasSelection()) { setSelection([], []); refresh(); return; }
    selectedVertex = null; renderOverlay();
  }
  else if (key === "enter" && (tool === "poly" || tool === "wall")) finishPath();
  else if (key === "backspace" && (draft?.tool === "poly" || draft?.tool === "wall")) { draft.pts.pop(); if (!draft.pts.length) draft = null; renderOverlay(); }
  else if ((key === "delete" || key === "backspace") && tool === "select") deleteSelected();
});
window.addEventListener("keyup", (e) => { if (e.code === "Space") spaceDown = false; });
new ResizeObserver(resize).observe(stage);

// ---- start ---------------------------------------------------------------------------------------------------------------------
$("title").textContent = DATA.title + " 描圖";
document.title = DATA.title + " 室內地圖描圖";
load();
buildScene();
setTool("select");
resize();
changed(false, false);
</script>
</body>
